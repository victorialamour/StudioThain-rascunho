<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dúvidas · 10 modelos · Studio Thainá</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   DÚVIDAS · 10 modelos no estilo do site (Fraunces leve com itálico rosado,
   Plus Jakarta Sans, fios finos, branco, sem caixas pesadas).
   Só entram as respostas já confirmadas; "Quanto tempo leva" e "Grávida ou
   amamentando" continuam esperando a Thainá e voltam quando confirmadas.
   ========================================================================== */
:root{--ink:#161616;--body:#4A4544;--muted:#6B6360;--line:#E7DFD9;--rose:#9A5457;--rose-l:#E8C6C6;--tint:#F6EDEA;--cream:#F8F1EB;--pad:clamp(20px,5vw,72px);--f:"Fraunces",Georgia,serif;--s:"Plus Jakarta Sans",system-ui,sans-serif;--out:cubic-bezier(.16,1,.3,1)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--body);font:15px/1.7 var(--s);-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:var(--rose);color:#fff}
:focus-visible{outline:2px solid var(--rose);outline-offset:3px;border-radius:2px}
h1,h2,h3,p,ul{margin:0}ul{list-style:none;padding:0}button,input{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer}
a{color:var(--rose);text-underline-offset:3px}
.top{padding:clamp(32px,5vw,56px) var(--pad) 24px;max-width:1180px}
.top h1{font:300 clamp(1.8rem,3.4vw,2.6rem)/1.08 var(--f);letter-spacing:-.025em;color:var(--ink)}
.top p{margin-top:.6rem;max-width:64ch;font-size:.9rem;color:var(--muted)}
.idx{position:sticky;top:0;z-index:10;display:flex;gap:.2rem;padding:.6rem var(--pad);background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.idx a{flex:none;padding:.35rem .6rem;font:500 .74rem var(--s);color:var(--muted);text-decoration:none;border-radius:4px}
.idx a:hover{color:var(--ink);background:var(--tint)}
.opt{scroll-margin-top:52px;border-top:8px solid var(--cream)}
.meta{display:flex;flex-wrap:wrap;gap:.2rem 1rem;align-items:baseline;padding:28px var(--pad) 0;max-width:1180px}
.meta b{font:300 1.3rem/1 var(--f);color:var(--rose)}
.meta strong{font-weight:600;font-size:.88rem;color:var(--ink)}
.meta span{font-size:.82rem;color:var(--muted)}
.sec{padding:clamp(44px,5.5vw,80px) var(--pad)}
.wrap{max-width:1080px;margin:0 auto}

/* ---- peças ---- */
.h{font:300 clamp(1.8rem,3vw,2.4rem)/1.1 var(--f);letter-spacing:-.025em;color:var(--ink)}
.h em{font-style:italic;color:var(--rose)}
.sub{margin-top:.6rem;font-size:.88rem;color:var(--muted)}
.qq{font-size:.98rem;font-weight:500;color:var(--ink);line-height:1.4}
.aa{font-size:.9rem;line-height:1.7;color:var(--body);max-width:62ch}
/* acordeão fino */
.acc{border-top:1px solid var(--line)}
.acc .it{border-bottom:1px solid var(--line)}
.acc button{display:flex;align-items:center;justify-content:space-between;gap:1.2rem;width:100%;padding:1rem 0;text-align:left}
.acc .pm{position:relative;width:12px;height:12px;flex:none}
.acc .pm::before,.acc .pm::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--ink);transition:transform .5s var(--out)}
.acc .pm::after{transform:rotate(90deg)}
.acc .it.open .pm::after{transform:rotate(0)}
.acc .body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s var(--out)}
.acc .it.open .body{grid-template-rows:1fr}
.acc .body>div{overflow:hidden}
.acc .body p{padding:0 0 1.1rem}

/* ===== 01 · Título lateral + acordeão fino ===== */
.o1 .g{display:grid;grid-template-columns:minmax(0,.7fr) minmax(0,1.3fr);gap:clamp(28px,6vw,96px);align-items:start}
.o1 .left{position:sticky;top:80px}

/* ===== 02 · Duas colunas ===== */
.o2 .head{margin-bottom:clamp(22px,3vw,32px)}
.o2 .cols{display:grid;grid-template-columns:1fr 1fr;gap:0 clamp(28px,5vw,64px);align-items:start}

/* ===== 03 · Por assunto (abas) ===== */
.o3 .head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:1rem 2rem;margin-bottom:clamp(20px,3vw,28px)}
.o3 .tabs{display:flex;gap:1.4rem;border-bottom:1px solid var(--line);margin-bottom:.4rem}
.o3 .tabs button{padding:.55rem 0;font-size:.84rem;font-weight:600;color:var(--muted);border-bottom:1px solid transparent;margin-bottom:-1px;transition:color .4s,border-color .4s}
.o3 .tabs button[aria-selected=true]{color:var(--ink);border-color:var(--rose)}
.o3 .acc{border-top:0}

/* ===== 04 · Pergunta e resposta lado a lado ===== */
.o4 .g{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.o4 .list{padding:1rem clamp(18px,3vw,40px) 1rem 0;border-right:1px solid var(--line)}
.o4 .list button{display:flex;align-items:baseline;gap:.7rem;width:100%;padding:.42rem 0;text-align:left;font:300 italic clamp(1.02rem,1.4vw,1.15rem)/1.35 var(--f);color:#B3A8A2;transition:color .4s var(--out)}
.o4 .list button::before{content:"";flex:none;width:0;height:1px;background:var(--rose);transform:translateY(-.3em);transition:width .5s var(--out)}
.o4 .list button[aria-selected=true]{color:var(--ink)}
.o4 .list button[aria-selected=true]::before{width:18px}
.o4 .list button:hover{color:var(--ink)}
.o4 .ans{padding:1.4rem 0 1.4rem clamp(18px,3vw,40px);position:sticky;top:60px;align-self:start}
.o4 .ans .qq{font:300 clamp(1.35rem,2.2vw,1.75rem)/1.2 var(--f);letter-spacing:-.02em}
.o4 .ans .aa{margin-top:.8rem}
.o4 .ans>*{animation:fi .6s var(--out)}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.o4 .head{margin-bottom:clamp(22px,3vw,32px)}

/* ===== 05 · Com busca ===== */
.o5 .g{display:grid;grid-template-columns:minmax(0,.7fr) minmax(0,1.3fr);gap:clamp(28px,6vw,96px);align-items:start}
.o5 .search{display:flex;align-items:center;gap:.6rem;margin-bottom:.4rem;padding:.7rem 0;border-bottom:1px solid var(--ink)}
.o5 .search svg{width:16px;height:16px;stroke:var(--muted);flex:none}
.o5 .search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:.95rem;color:var(--ink)}
.o5 .search input::placeholder{color:#A39892}
.o5 .none{display:none;padding:1rem 0;font-size:.88rem;color:var(--muted)}
.o5 .acc{border-top:0}

/* ===== 06 · Faixa creme ===== */
.o6{background:var(--cream)}
.o6 .wrap{max-width:820px;text-align:center}
.o6 .acc{margin-top:clamp(22px,3vw,32px);text-align:left;border-color:#E3D6CC}
.o6 .acc .it{border-color:#E3D6CC}

/* ===== 07 · Como uma conversa ===== */
.o7 .g{display:grid;grid-template-columns:minmax(0,.6fr) minmax(0,1.4fr);gap:clamp(28px,6vw,96px);align-items:start}
.o7 .chips{display:flex;flex-wrap:wrap;gap:8px}
.o7 .chips button{padding:.5rem .85rem;border-radius:16px 16px 4px 16px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);font-size:.84rem;color:var(--ink);transition:background .3s,box-shadow .3s}
.o7 .chips button:hover{box-shadow:inset 0 0 0 1px var(--rose-l)}
.o7 .chips button[aria-pressed=true]{background:var(--tint);box-shadow:inset 0 0 0 1px transparent}
.o7 .thread{display:flex;flex-direction:column;gap:8px;margin-top:18px;min-height:8rem}
.o7 .me{align-self:flex-end;max-width:80%;padding:.6rem .9rem;border-radius:16px 16px 4px 16px;background:var(--tint);font-size:.9rem;color:var(--ink)}
.o7 .her{align-self:flex-start;max-width:86%;padding:.7rem .95rem;border-radius:16px 16px 16px 4px;background:var(--cream);font-size:.9rem;line-height:1.6;color:var(--body)}
.o7 .her b{display:block;margin-bottom:.15rem;font:300 italic .95rem var(--f);color:var(--rose)}
.o7 .thread>*{animation:fi .5s var(--out) both}
.o7 .thread .her{animation-delay:.35s}

/* ===== 08 · As três principais + o resto ===== */
.o8 .head{margin-bottom:clamp(22px,3vw,32px)}
.o8 .top3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,3.5vw,48px);padding-bottom:clamp(22px,3vw,32px)}
.o8 .top3 div{padding-top:14px;border-top:1px solid var(--ink)}
.o8 .top3 .qq{font:300 clamp(1.15rem,1.7vw,1.35rem)/1.25 var(--f);letter-spacing:-.015em}
.o8 .top3 .aa{margin-top:.55rem;font-size:.86rem}
.o8 .more{margin-top:.4rem}

/* ===== 09 · Índice e respostas abertas ===== */
.o9 .g{display:grid;grid-template-columns:minmax(0,.55fr) minmax(0,1.45fr);gap:clamp(28px,6vw,96px);align-items:start}
.o9 nav{position:sticky;top:70px;display:flex;flex-direction:column;gap:.15rem;margin-top:1.2rem}
.o9 nav a{padding:.2rem 0;font-size:.82rem;color:var(--muted);text-decoration:none;transition:color .3s}
.o9 nav a:hover{color:var(--ink)}
.o9 .items{display:grid;gap:0}
.o9 .items div{padding:1rem 0;border-top:1px solid var(--line);scroll-margin-top:70px}
.o9 .items .qq{font:300 clamp(1.1rem,1.6vw,1.3rem)/1.3 var(--f);letter-spacing:-.012em}
.o9 .items .aa{margin-top:.4rem}

/* ===== 10 · Pílulas e uma resposta ===== */
.o10 .wrap{max-width:900px;text-align:center}
.o10 .pills{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:clamp(22px,3vw,30px)}
.o10 .pills button{padding:.45rem .9rem;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line);font-size:.82rem;color:var(--ink);transition:background .35s,color .35s,box-shadow .35s}
.o10 .pills button:hover{box-shadow:inset 0 0 0 1px var(--ink)}
.o10 .pills button[aria-pressed=true]{background:var(--ink);color:#fff;box-shadow:none}
.o10 .ans{max-width:620px;min-height:5.6em;margin:clamp(22px,3vw,30px) auto 0;padding-top:clamp(18px,2.4vw,24px);border-top:1px solid var(--line)}
.o10 .ans .aa{margin:0 auto;font-size:.95rem}
.o10 .ans>*{animation:fi .6s var(--out)}

@media (max-width:767px){
  .o1 .g,.o2 .cols,.o4 .g,.o5 .g,.o7 .g,.o9 .g{grid-template-columns:minmax(0,1fr)}
  .o1 .left,.o9 nav{position:static}
  .o4 .list{padding-right:0;border-right:0;border-bottom:1px solid var(--line)}
  .o4 .ans{position:static;padding-left:0}
  .o8 .top3{grid-template-columns:minmax(0,1fr)}
  .o9 nav{display:none}
}
</style>
</head>
<body>
<header class="top">
  <h1>Dúvidas · 10 modelos</h1>
  <p>No estilo do site: título em Fraunces com itálico rosado, fios finos, sem caixas pesadas. Entram só as respostas já confirmadas; as duas que dependem da Thainá (tempo de atendimento e grávidas/amamentando) voltam quando ela responder.</p>
</header>
<nav class="idx" id="idx" aria-label="Modelos"></nav>
<main id="opts"></main>
<script>
const WA='https://wa.me/5581992901559?text='+encodeURIComponent('Oi Thainá, tenho uma dúvida');
const F=[
 {q:'Como eu sei qual procedimento é ideal pra mim?',a:'Eu faço uma avaliação antes e indico só o que faz sentido pro seu rosto e pra sua rotina. Nem toda sobrancelha precisa de micropigmentação.',c:0,s:'Qual é o ideal'},
 {q:'Dói?',a:'Design, henna, brow lamination e lash lifting não doem.',c:0,s:'Dói?'},
 {q:'Qual a diferença entre fio a fio e shadow?',a:'O fio a fio simula fios naturais e fica mais delicado. O shadow tem efeito sombreado, parecido com henna, pra quem quer a sobrancelha sempre definida.',c:1,s:'Fio a fio ou shadow'},
 {q:'A micropigmentação tem retoque?',a:'Sim. Estão inclusos o acompanhamento completo, o retoque e os cuidados pós-procedimento.',c:1,s:'Retoque'},
 {q:'Brow Lamination e Lash Lifting precisam de manutenção?',a:'Não. O Brow Lamination dura até 4 semanas e o Lash Lifting até 30 dias.',c:1,s:'Manutenção'},
 {q:'Vocês atendem pele madura e fios brancos?',a:'Sim. Tenho técnica de micropigmentação pra pele madura, e o design com tintura é ótimo pra cobrir fios brancos.',c:0,s:'Pele madura'},
 {q:'Quanto custa?',a:'Design R$ 30 · henna ou tintura R$ 55 · descoloração + coloração R$ 99,90 · spa labial R$ 20 · brow lamination R$ 145 · lash lifting R$ 160 · micropigmentação R$ 670.',c:2,s:'Valores'},
 {q:'Posso parcelar?',a:'Sim. A micropigmentação sai em até 10x, e o Brow Lamination e o Lash Lifting em até 2x.',c:2,s:'Parcelar'},
 {q:'Como funciona o agendamento?',a:'Você escolhe o serviço, o dia e o período logo no começo da página (ou me chama direto no WhatsApp) e eu confirmo o horário por lá. Chegue 10 minutinhos antes pra aproveitar com calma.',c:2,s:'Agendamento'},
];
const CATS=['Procedimentos','Micropigmentação e manutenção','Valores e agendamento'];
const H='<h2 class="h">Ficou alguma <em>dúvida?</em></h2>';
const SUB=`<p class="sub">Não achou a resposta? <a href="${WA}" target="_blank" rel="noopener">Me chama no WhatsApp</a>.</p>`;
const acc=(list,open=0)=>`<div class="acc">${list.map((x,k)=>`<div class="it${k===open?' open':''}"><button type="button" aria-expanded="${k===open}"><span class="qq">${x.q}</span><span class="pm" aria-hidden="true"></span></button><div class="body"><div><p class="aa">${x.a}</p></div></div></div>`).join('')}</div>`;
const SEARCH='<svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg>';
const O=[
 ['Título lateral e lista fina','o título fica parado à esquerda; à direita, as perguntas numa lista fina que abre suave, com um “+” que vira “−”.',
  `<div class="sec o1"><div class="wrap g"><div class="left">${H}${SUB}</div>${acc(F)}</div></div>`],
 ['Duas colunas','as perguntas divididas em duas colunas, para a seção ficar mais baixa.',
  `<div class="sec o2"><div class="wrap"><div class="head">${H}${SUB}</div><div class="cols">${acc(F.slice(0,5),-1)}${acc(F.slice(5),-1)}</div></div></div>`],
 ['Por assunto','três abas (Procedimentos, Micropigmentação e manutenção, Valores e agendamento); cada aba mostra só as perguntas daquele assunto.',
  `<div class="sec o3"><div class="wrap"><div class="head"><div>${H}${SUB}</div></div><div class="tabs" role="tablist">${CATS.map((c,i)=>`<button role="tab" aria-selected="${!i}" data-c="${i}">${c}</button>`).join('')}</div><div class="panel"></div></div></div>`],
 ['Pergunta e resposta lado a lado','as perguntas em itálico à esquerda; a resposta da que está selecionada aparece grande à direita.',
  `<div class="sec o4"><div class="wrap"><div class="head">${H}${SUB}</div><div class="g"><div class="list" role="tablist">${F.map((x,i)=>`<button role="tab" aria-selected="${!i}" data-i="${i}">${x.q}</button>`).join('')}</div><div class="ans" aria-live="polite"></div></div></div></div>`],
 ['Com busca','um campo para digitar a dúvida; a lista filtra na hora enquanto a pessoa escreve.',
  `<div class="sec o5"><div class="wrap g"><div>${H}${SUB}</div><div><label class="search">${SEARCH}<input type="search" placeholder="Digite sua dúvida (ex.: parcelar, dói, retoque)" aria-label="Procurar dúvida"></label>${acc(F,-1)}<p class="none">Não encontrei essa dúvida. <a href="${WA}" target="_blank" rel="noopener">Me chama no WhatsApp</a>.</p></div></div></div>`],
 ['Faixa creme centralizada','uma faixa creme suave de ponta a ponta, título centralizado e a lista fina no meio. Dá cor sem pesar.',
  `<div class="sec o6"><div class="wrap">${H}${SUB}${acc(F)}</div></div>`],
 ['Como uma conversa','as dúvidas viram mensagens: a pessoa toca numa pergunta e a resposta da Thainá chega como no WhatsApp.',
  `<div class="sec o7"><div class="wrap g"><div>${H}${SUB}</div><div><div class="chips">${F.map((x,i)=>`<button type="button" aria-pressed="${!i}" data-i="${i}">${x.q}</button>`).join('')}</div><div class="thread" aria-live="polite"></div></div></div></div>`],
 ['As três principais e o resto','as três dúvidas mais comuns já respondidas, em colunas; as outras numa lista fina embaixo.',
  `<div class="sec o8"><div class="wrap"><div class="head">${H}${SUB}</div><div class="top3">${[F[0],F[6],F[8]].map(x=>`<div><p class="qq">${x.q}</p><p class="aa">${x.a}</p></div>`).join('')}</div><div class="more">${acc(F.filter((x,i)=>![0,6,8].includes(i)),-1)}</div></div></div>`],
 ['Índice e respostas abertas','à esquerda, um índice com as perguntas; à direita, todas as respostas abertas, como um texto de revista.',
  `<div class="sec o9"><div class="wrap g"><div>${H}${SUB}<nav aria-label="Perguntas">${F.map((x,i)=>`<a href="#q9-${i}">${x.s}</a>`).join('')}</nav></div><div class="items">${F.map((x,i)=>`<div id="q9-${i}"><p class="qq">${x.q}</p><p class="aa">${x.a}</p></div>`).join('')}</div></div></div>`],
 ['Pílulas e uma resposta','as dúvidas viram pílulas curtas (Dói?, Valores, Parcelar…); ao tocar, a resposta aparece embaixo. A mais compacta.',
  `<div class="sec o10"><div class="wrap">${H}${SUB}<div class="pills">${F.map((x,i)=>`<button type="button" aria-pressed="${!i}" data-i="${i}">${x.s}</button>`).join('')}</div><div class="ans" aria-live="polite"></div></div></div>`],
];
const pad=i=>String(i+1).padStart(2,'0');
document.getElementById('idx').innerHTML=O.map((o,i)=>`<a href="#o${i+1}">${pad(i)}</a>`).join('');
document.getElementById('opts').innerHTML=O.map((o,i)=>`<section class="opt" id="o${i+1}"><div class="meta"><b>${pad(i)}</b><strong>${o[0]}</strong><span>${o[1]}</span></div>${o[2]}</section>`).join('');

/* acordeões: um aberto por vez dentro de cada lista */
const wireAcc=root=>root.querySelectorAll('.acc').forEach(a=>a.querySelectorAll('.it>button').forEach(b=>b.addEventListener('click',()=>{const it=b.parentElement,o=!it.classList.contains('open');a.querySelectorAll('.it').forEach(x=>{x.classList.remove('open');x.querySelector('button').setAttribute('aria-expanded','false')});if(o){it.classList.add('open');b.setAttribute('aria-expanded','true')}})));
wireAcc(document);
/* 03 · abas */
(()=>{const box=document.querySelector('.o3'),tabs=[...box.querySelectorAll('[role=tab]')],p=box.querySelector('.panel');
 const go=c=>{tabs.forEach((t,k)=>t.setAttribute('aria-selected',k===c));p.innerHTML=acc(F.filter(x=>x.c===c));wireAcc(p)};tabs.forEach((t,k)=>t.addEventListener('click',()=>go(k)));go(0)})();
/* 04 · lado a lado */
(()=>{const box=document.querySelector('.o4'),b=[...box.querySelectorAll('[role=tab]')],ans=box.querySelector('.ans');
 const go=n=>{b.forEach((x,k)=>x.setAttribute('aria-selected',k===n));ans.innerHTML=`<p class="qq">${F[n].q}</p><p class="aa">${F[n].a}</p>`};b.forEach((x,k)=>{x.addEventListener('click',()=>go(k));x.addEventListener('mouseenter',()=>go(k))});go(0)})();
/* 05 · busca */
(()=>{const box=document.querySelector('.o5'),inp=box.querySelector('input'),its=[...box.querySelectorAll('.it')],none=box.querySelector('.none');
 const norm=t=>t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
 inp.addEventListener('input',()=>{const v=norm(inp.value.trim());let n=0;its.forEach((it,k)=>{const ok=!v||norm(F[k].q+' '+F[k].a).includes(v);it.style.display=ok?'':'none';if(ok)n++});none.style.display=n?'none':'block'})})();
/* 07 · conversa */
(()=>{const box=document.querySelector('.o7'),b=[...box.querySelectorAll('.chips button')],th=box.querySelector('.thread');
 const go=n=>{b.forEach((x,k)=>x.setAttribute('aria-pressed',k===n));th.innerHTML=`<p class="me">${F[n].q}</p><p class="her"><b>Thainá</b>${F[n].a}</p>`};b.forEach((x,k)=>x.addEventListener('click',()=>go(k)));go(0)})();
/* 10 · pílulas */
(()=>{const box=document.querySelector('.o10'),b=[...box.querySelectorAll('.pills button')],ans=box.querySelector('.ans');
 const go=n=>{b.forEach((x,k)=>x.setAttribute('aria-pressed',k===n));ans.innerHTML=`<p class="aa"><strong style="color:var(--ink);font-weight:600">${F[n].q}</strong> ${F[n].a}</p>`};b.forEach((x,k)=>x.addEventListener('click',()=>go(k)));go(0)})();
</script>
</body>
</html>
