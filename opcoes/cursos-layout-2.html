<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cursos · 10 novas formatações · Studio Thainá</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&family=Pinyon+Script&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   CURSOS · 10 novas formatações (rodada 2)
   Cada opção mostra a seção inteira: título, fala da Thainá, vídeo,
   4 pilares e foto da aula. Fundo oliva, fontes do site.
   ========================================================================== */
:root{--olive:#4E5446;--olive-d:#3F4439;--rose-l:#E8C6C6;--cream:#EDDAC9;--paper:#F6EEE6;--ln:rgba(243,234,224,.2);--pad:clamp(20px,5vw,72px);--f:"Fraunces",Georgia,serif;--pin:"Pinyon Script",cursive;--out:cubic-bezier(.16,1,.3,1)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:#fff;color:#4A4544;font:15px/1.7 "Plus Jakarta Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,p,ol,ul,figure{margin:0}ol,ul{list-style:none;padding:0}
img,video{display:block;max-width:100%}
::selection{background:var(--rose-l);color:#2a2a2a}
.top{padding:clamp(32px,5vw,56px) var(--pad) 24px;max-width:1180px}
.top h1{font:300 clamp(1.8rem,3.4vw,2.6rem)/1.08 var(--f);letter-spacing:-.025em;color:#161616}
.top p{margin-top:.6rem;max-width:66ch;font-size:.9rem;color:#6B6360}
.idx{position:sticky;top:0;z-index:30;display:flex;gap:.2rem;padding:.6rem var(--pad);background:rgba(255,255,255,.95);border-bottom:1px solid #E7DFD9;overflow-x:auto}
.idx a{flex:none;padding:.35rem .6rem;font:500 .74rem "Plus Jakarta Sans";color:#6B6360;text-decoration:none;border-radius:4px}
.idx a:hover,.idx a:focus-visible{color:#161616;background:#F6EDEA;outline:none}
.opt{scroll-margin-top:52px}
.meta{display:flex;flex-wrap:wrap;gap:.2rem 1rem;align-items:baseline;padding:40px var(--pad) 14px;max-width:1180px}
.meta b{font:300 1.3rem/1 var(--f);color:#9A5457}
.meta strong{font-weight:600;font-size:.88rem;color:#161616}
.meta span{font-size:.82rem;color:#6B6360}
.sec{background:var(--olive);color:rgba(255,255,255,.8);padding:clamp(64px,8vw,104px) var(--pad);overflow:hidden}
.wrap{max-width:1120px;margin:0 auto}
/* título da seção (igual ao site) */
.hd{display:flex;flex-direction:column;align-items:center;text-align:center;margin:0 auto clamp(48px,6vw,72px);max-width:640px}
.hd svg{width:14px;height:14px;fill:var(--rose-l);margin-bottom:18px}
.hd .w{display:block;font:300 clamp(3rem,7vw,5.4rem)/.92 var(--f);font-variation-settings:"opsz" 144;letter-spacing:-.035em;color:#fff}
.hd .wh{display:block;margin-top:.35rem;font:400 clamp(1.7rem,3.2vw,2.4rem)/1.1 var(--pin);color:var(--cream)}
.hd .ld{margin-top:16px;max-width:40ch;font-size:.98rem;line-height:1.6;color:rgba(255,255,255,.78)}
.hd.l{align-items:flex-start;text-align:left;margin-left:0}
/* peças comuns */
.say{font:300 italic clamp(1.6rem,2.8vw,2.3rem)/1.14 var(--f);letter-spacing:-.02em;color:#fff;text-wrap:balance}
.rest{margin-top:.8rem;max-width:44ch;font-size:.98rem;line-height:1.7;color:rgba(255,255,255,.78)}
.sig{display:block;margin-top:.7rem;font:400 1.9rem/1 var(--pin);color:var(--cream)}
.n{font:300 1rem/1 var(--f);color:var(--rose-l)}
.pt{font:300 1.15rem/1.3 var(--f);color:#fff}
.pd{margin-top:.3rem;font-size:.87rem;line-height:1.6;color:rgba(255,255,255,.72)}
.m{position:relative;overflow:hidden;border-radius:10px;background:#3a3f34}
.m video,.m img{width:100%;height:100%;object-fit:cover}
.cap{font-size:.8rem;color:rgba(255,255,255,.7)}
.star{display:inline-block;width:9px;height:9px;fill:var(--rose-l);flex:none}

/* 01 · Vídeo redondo e fala assinada (ecoa o "Conheça o studio") */
.a1 .g{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(36px,6vw,96px);align-items:center}
.a1 .ring{position:relative;width:clamp(240px,26vw,340px);aspect-ratio:1}
.a1 .ring .m{position:absolute;inset:18px;border-radius:50%}
.a1 .ring svg.txt{position:absolute;inset:0;width:100%;height:100%;animation:spin 40s linear infinite}
.a1 .ring text{font:500 9.2px "Plus Jakarta Sans";letter-spacing:.32em;text-transform:uppercase;fill:rgba(237,218,201,.75)}
@keyframes spin{to{transform:rotate(360deg)}}
.a1 .pl{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem 2.4rem;margin-top:clamp(48px,6vw,72px);padding-top:clamp(32px,4vw,48px);border-top:1px solid var(--ln)}
.a1 .pl li{display:grid;grid-template-columns:auto 1fr;gap:.15rem .8rem}
.a1 .pl .star{margin-top:.45rem;grid-row:span 2}
.a1 .pl .pd{margin-top:0}

/* 02 · Painel creme sobre a foto */
.a2 .g{position:relative;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr)}
.a2 .g>.m{grid-column:1/2;grid-row:1;aspect-ratio:4/3.4}
.a2 .card{grid-column:2/3;grid-row:1;align-self:center;margin-left:-18%;position:relative;z-index:1;padding:clamp(28px,3.5vw,48px);border-radius:10px;background:var(--paper);color:#4A4544}
.a2 .card .say{color:#262423;font-size:clamp(1.4rem,2.2vw,1.85rem)}
.a2 .card .rest{color:#5E5754;font-size:.92rem}
.a2 .card ol{margin-top:1.4rem;border-top:1px solid #E2D4C8}
.a2 .card li{display:grid;grid-template-columns:2rem 1fr;gap:.1rem .6rem;padding:.75rem 0;border-bottom:1px solid #E2D4C8}
.a2 .card .n{grid-row:span 2;color:#A3605F;padding-top:.15rem}
.a2 .card .pt{color:#262423;font-size:1.05rem}
.a2 .card .pd{color:#6B6360;margin-top:0;font-size:.84rem}
.a2 .vrow{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(24px,4vw,56px);align-items:center;margin-top:clamp(40px,5vw,64px)}
.a2 .vrow .m{aspect-ratio:16/10}

/* 03 · Faixa que corre para o lado */
.a3{padding-inline:0}
.a3 .hd{padding:0 var(--pad)}
.a3 .track{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 var(--pad) 18px;scrollbar-width:thin;scrollbar-color:rgba(232,198,198,.5) transparent}
.a3 .track>*{flex:none;scroll-snap-align:start;height:clamp(380px,40vw,460px);border-radius:10px}
.a3 .q{width:clamp(280px,32vw,400px);display:flex;flex-direction:column;justify-content:flex-end;padding:28px;border:1px solid var(--ln)}
.a3 .track .m{width:clamp(240px,26vw,320px)}
.a3 .track .m.wide{width:clamp(320px,46vw,600px)}
.a3 .p{width:clamp(220px,22vw,260px);display:flex;flex-direction:column;padding:26px;background:var(--olive-d)}
.a3 .p .n{font-size:3.4rem;letter-spacing:-.04em;margin-bottom:auto}
.a3 .hint{padding:6px var(--pad) 0;font-size:.78rem;color:rgba(243,234,224,.6)}

/* 04 · Vídeo parado, pilares rolam */
.a4 .g{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(36px,6vw,96px)}
.a4 .pin{position:sticky;top:72px;align-self:start}
.a4 .pin .m{aspect-ratio:4/5;max-height:72vh;margin-top:1.6rem}
.a4 .rows li{min-height:46vh;display:flex;flex-direction:column;justify-content:center;opacity:.32;transition:opacity .6s var(--out)}
.a4 .rows li.on{opacity:1}
.a4 .rows .n{font-size:clamp(3.6rem,7vw,5.6rem);line-height:.9;letter-spacing:-.05em;margin-bottom:.8rem}
.a4 .rows .pt{font-size:clamp(1.5rem,2.4vw,2rem)}
.a4 .rows .pd{font-size:.98rem;max-width:38ch}
.a4 .rows .m{margin-top:1.2rem;aspect-ratio:16/9;max-width:440px}

/* 05 · Sanfona */
.a5 .g{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(36px,6vw,96px);align-items:center}
.a5 .m{aspect-ratio:4/5;max-height:580px}
.a5 details{border-bottom:1px solid var(--ln)}
.a5 .acc{margin-top:1.8rem;border-top:1px solid var(--ln)}
.a5 summary{display:flex;align-items:center;gap:1rem;padding:1.1rem 0;cursor:pointer;list-style:none}
.a5 summary::-webkit-details-marker{display:none}
.a5 summary .pt{flex:1;font-size:1.3rem}
.a5 summary::after{content:"";width:12px;height:12px;flex:none;border:solid var(--rose-l);border-width:0 1px 1px 0;transform:rotate(45deg) translateY(-3px);transition:transform .4s var(--out)}
.a5 details[open] summary::after{transform:rotate(-135deg) translateY(-3px)}
.a5 details .pd{padding:0 0 1.2rem 2.2rem;margin:0;font-size:.95rem}
.a5 details .m2{margin:0 0 1.2rem 2.2rem;aspect-ratio:16/9;max-width:380px}

/* 06 · Vídeo de fundo */
.a6{position:relative;padding:0;min-height:clamp(640px,62vw,760px);display:flex;flex-direction:column}
.a6>.m{position:absolute;inset:0;border-radius:0}
.a6::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(62,67,56,.86) 0%,rgba(62,67,56,.38) 45%,rgba(52,56,47,.93) 100%)}
.a6 .in{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;padding:clamp(64px,8vw,104px) var(--pad) clamp(36px,4vw,56px)}
.a6 .say{text-align:center;margin:0 auto;max-width:22ch}
.a6 .row{margin-top:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding-top:clamp(40px,5vw,64px)}
.a6 .row li{padding:0 clamp(14px,2vw,28px);border-left:1px solid var(--ln)}
.a6 .row li:first-child{border-left:0;padding-left:0}
.a6 .row .n{display:block;margin-bottom:.5rem}

/* 07 · Fotos sobrepostas */
.a7 .g{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(40px,7vw,104px);align-items:center}
.a7 .stack{position:relative;padding:0 14% 16% 0}
.a7 .stack .m1{aspect-ratio:4/3.2}
.a7 .stack .m2{position:absolute;right:0;bottom:0;width:44%;aspect-ratio:4/5;box-shadow:0 0 0 8px var(--olive)}
.a7 .stack .cap{position:absolute;left:0;bottom:0;max-width:48%}
.a7 .pl{margin-top:1.8rem}
.a7 .pl li{display:grid;grid-template-columns:2.4rem 1fr;gap:.1rem .6rem;padding:.9rem 0;border-top:1px solid var(--ln)}
.a7 .pl .n{grid-row:span 2;padding-top:.2rem}
.a7 .pl .pd{margin-top:0}

/* 08 · Colunas de revista */
.a8 .lead{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:clamp(32px,5vw,72px);align-items:end;padding-bottom:clamp(32px,4vw,48px);border-bottom:1px solid var(--ln)}
.a8 .say{font-size:clamp(2rem,4.2vw,3.4rem);line-height:1.04}
.a8 .cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.a8 .cols li{padding:clamp(24px,3vw,36px) clamp(14px,2vw,28px) 0;border-left:1px solid var(--ln)}
.a8 .cols li:first-child{border-left:0;padding-left:0}
.a8 .cols .n{display:block;font:400 2.6rem/1 var(--pin);color:var(--cream);margin-bottom:.6rem}
.a8 .media{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:12px;margin-top:clamp(40px,5vw,64px)}
.a8 .media .m{height:clamp(240px,28vw,380px)}

/* 09 · Grade de células */
.a9 .bento{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(150px,auto);gap:1px;background:var(--ln);border:1px solid var(--ln);border-radius:10px;overflow:hidden}
.a9 .bento>*{background:var(--olive);padding:clamp(20px,2.4vw,30px)}
.a9 .bento .v{grid-row:span 3;padding:0}
.a9 .bento .v .m{height:100%;border-radius:0}
.a9 .bento .q{grid-column:span 2;display:flex;flex-direction:column;justify-content:center}
.a9 .bento .ph{grid-column:span 2;padding:0;min-height:260px}
.a9 .bento .ph .m{height:100%;border-radius:0}
.a9 .bento .c .n{display:block;margin-bottom:.6rem}

/* 10 · Mínimo */
.a10 .say{text-align:center;margin:0 auto;max-width:24ch}
.a10 .rest{text-align:center;margin:.9rem auto 0}
.a10 .line{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.7rem 1.2rem;margin:clamp(32px,4vw,48px) auto 0;max-width:820px;font:300 clamp(1.05rem,1.6vw,1.25rem)/1.3 var(--f);color:#fff}
.a10 .strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:clamp(40px,5vw,64px)}
.a10 .strip .m{aspect-ratio:4/5}
.a10 .strip figcaption{margin-top:.6rem}

a:focus-visible,summary:focus-visible{outline:1px solid var(--rose-l);outline-offset:4px}
@media (prefers-reduced-motion:reduce){.a1 .ring svg.txt{animation:none}}
@media (max-width:860px){
  .a1 .g,.a4 .g,.a5 .g,.a7 .g,.a8 .lead{grid-template-columns:minmax(0,1fr)}
  .a1 .ring{margin:0 auto}
  .a1 .pl{grid-template-columns:minmax(0,1fr)}
  .a2 .g,.a2 .vrow{grid-template-columns:minmax(0,1fr)}
  .a2 .card{grid-column:1;grid-row:2;margin:-48px 14px 0}
  .a4 .pin{position:static}.a4 .rows li{min-height:0;padding:1.6rem 0;opacity:1}
  .a6 .row,.a8 .cols{grid-template-columns:1fr 1fr;row-gap:1.6rem}
  .a6 .row li,.a8 .cols li{border-left:0;padding-left:0;padding-right:12px}
  .a8 .media{grid-template-columns:minmax(0,1fr)}
  .a9 .bento{grid-template-columns:1fr 1fr}
  .a9 .bento .v{grid-row:auto;grid-column:span 2;aspect-ratio:4/5}
  .a9 .bento .q,.a9 .bento .ph{grid-column:span 2}
  .a10 .strip{grid-template-columns:1fr 1fr}.a10 .strip>:last-child{display:none}
}
@media (max-width:480px){.a6 .row,.a8 .cols,.a9 .bento{grid-template-columns:minmax(0,1fr)}.a9 .bento .v,.a9 .bento .q,.a9 .bento .ph{grid-column:auto}}
</style>
</head>
<body>
<header class="top">
  <h1>Cursos · 10 novas formatações</h1>
  <p>Rodada nova, bem diferente das anteriores. Cada opção mostra a seção inteira dos Cursos (título, sua fala, vídeo, os 4 pilares e a foto da aula), para você ver o conjunto.</p>
</header>
<nav class="idx" id="idx" aria-label="Opções"></nav>
<main id="opts"></main>
<script>
const IMG='../assets/img/', VSRC='../assets/video/cursos.mp4';
const STAR='<svg class="star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0c.6 6.6 3.9 10.8 12 12-8.1 1.2-11.4 5.4-12 12-.6-6.6-3.9-10.8-12-12 8.1-1.2 11.4-5.4 12-12Z"/></svg>';
const HD=(l='')=>`<header class="hd ${l}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0c.6 6.6 3.9 10.8 12 12-8.1 1.2-11.4 5.4-12 12-.6-6.6-3.9-10.8-12-12 8.1-1.2 11.4-5.4 12-12Z"/></svg><h2><span class="w">Cursos</span><span class="wh">de design de sobrancelhas</span></h2><p class="ld">Aprenda a profissão com quem vive dela. Presenciais, em turma pequena, em Carpina-PE.</p></header>`;
const SAY='<p class="say">Eu sei, porque já estive do outro lado.</p>';
const REST='<p class="rest">Com medo de começar, achando que não estava pronta. Hoje vivo da profissão que escolhi, e ensino o caminho que eu percorri.</p>';
const P=[['Técnica com olhar profissional','Do desenho à finalização, entendendo o porquê de cada escolha.'],['Prática de verdade','Você observa e depois atende modelo real, dentro do studio.'],['Correção de perto','Eu corrijo o que for preciso, até você tomar decisões sozinha.'],['Você sai preparada','Com apostila, certificado e confiança pra começar a atender.']];
const CAP='Demonstração ao vivo: você acompanha cada passo de perto antes de atender.';
const ALT='Thainá demonstrando o procedimento em modelo, com alunas acompanhando';
const V=(c='')=>`<figure class="m ${c}"><video data-src="${VSRC}" muted loop playsinline preload="none" aria-label="Thainá com alunas no studio"></video></figure>`;
const D=(c='')=>`<figure class="m ${c}"><img src="${IMG}cursos/aula-demonstracao.webp" alt="${ALT}" loading="lazy"></figure>`;
const T=(f,c='')=>`<figure class="m ${c}"><img src="${IMG}alunas/${f}" alt="Alunas com certificado no studio" loading="lazy"></figure>`;
const li=(i,p,inner)=>inner?inner(i,p):`<li><span class="n">0${i+1}</span><p class="pt">${p[0]}</p><p class="pd">${p[1]}</p></li>`;
const O=[
 ['Vídeo redondo e fala assinada','o vídeo num círculo com um texto girando devagar em volta, como o retrato do “Conheça o studio”; a fala assinada em cursiva; os pilares com a estrela do logo.',
 `<section class="sec a1"><div class="wrap">${HD()}<div class="g"><div class="ring">${V()}<svg class="txt" viewBox="0 0 200 200" aria-hidden="true"><defs><path id="c1" d="M100,100 m-92,0 a92,92 0 1,1 184,0 a92,92 0 1,1 -184,0"/></defs><text><textPath href="#c1">turma pequena · prática real · certificado · carpina-pe · </textPath></text></svg></div><div>${SAY}${REST}<span class="sig">Thainá</span></div></div><ul class="pl">${P.map(p=>`<li>${STAR}<p class="pt">${p[0]}</p><p class="pd">${p[1]}</p></li>`).join('')}</ul></div></section>`],
 ['Painel creme sobre a foto','a foto da aula grande, com um painel claro por cima trazendo a fala e os pilares; o vídeo embaixo, ao lado da legenda. Cria contraste e parece página de revista.',
 `<section class="sec a2"><div class="wrap">${HD()}<div class="g">${D()}<div class="card">${SAY}${REST}<ol>${P.map((p,i)=>li(i,p)).join('')}</ol></div></div><div class="vrow"><p class="rest" style="margin:0">${CAP}</p>${V()}</div></div></section>`],
 ['Faixa que corre para o lado','tudo numa faixa só que você arrasta para o lado: fala, vídeo, um painel por pilar com número grande e a foto da aula. Ocupa pouca altura.',
 `<section class="sec a3">${HD()}<div class="track" tabindex="0" aria-label="Arraste para o lado"><div class="q">${SAY}${REST}</div>${V()}${P.map((p,i)=>`<div class="p"><span class="n">0${i+1}</span><p class="pt">${p[0]}</p><p class="pd">${p[1]}</p></div>`).join('')}${D('wide')}</div><p class="hint">Arraste para o lado →</p></section>`],
 ['Vídeo parado, pilares rolam','o vídeo e a fala ficam parados à esquerda enquanto os pilares sobem um por vez à direita, com número grande; o que está no meio da tela acende.',
 `<section class="sec a4"><div class="wrap">${HD()}<div class="g"><div class="pin">${SAY}${V()}</div><ol class="rows">${P.map((p,i)=>`<li><span class="n">0${i+1}</span><p class="pt">${p[0]}</p><p class="pd">${p[1]}</p>${i===1?D():''}</li>`).join('')}</ol></div></div></section>`],
 ['Sanfona','vídeo ao lado; os pilares abrem e fecham como nas Dúvidas, com a mesma linguagem do site. Bem compacto; a foto da aula aparece dentro de “Prática de verdade”.',
 `<section class="sec a5"><div class="wrap">${HD()}<div class="g">${V()}<div>${SAY}${REST}<div class="acc">${P.map((p,i)=>`<details ${i===0?'open':''}><summary><span class="n">0${i+1}</span><span class="pt">${p[0]}</span></summary><p class="pd">${p[1]}</p>${i===1?D('m2'):''}</details>`).join('')}</div></div></div></div></section>`],
 ['Vídeo de fundo','o vídeo ocupa a seção inteira, escurecido; o título e a fala por cima, e os 4 pilares numa linha no rodapé, separados por fios finos. Sem a foto da aula.',
 `<section class="sec a6">${V()}<div class="in">${HD()}${SAY}<ol class="row">${P.map((p,i)=>li(i,p)).join('')}</ol></div></section>`],
 ['Fotos sobrepostas','a foto da aula grande e o vídeo menor por cima, no canto, como fotos sobre a mesa; fala e pilares numa lista à direita.',
 `<section class="sec a7"><div class="wrap">${HD()}<div class="g"><div class="stack">${D('m1')}${V('m2')}</div><div>${SAY}${REST}<ol class="pl">${P.map((p,i)=>li(i,p)).join('')}</ol></div></div></div></section>`],
 ['Colunas de revista','a fala bem grande; os pilares em 4 colunas separadas por fios, com os números em cursiva creme; foto e vídeo lado a lado no fim.',
 `<section class="sec a8"><div class="wrap">${HD()}<div class="lead">${SAY}${REST.replace('class="rest"','class="rest" style="margin:0"')}</div><ol class="cols">${P.map((p,i)=>`<li><span class="n">${i+1}</span><p class="pt">${p[0]}</p><p class="pd">${p[1]}</p></li>`).join('')}</ol><div class="media">${D()}${V()}</div></div></section>`],
 ['Grade de células','tudo numa grade fina, sem caixas pesadas: vídeo alto à esquerda, a fala, os pilares cada um na sua célula e a foto da aula embaixo.',
 `<section class="sec a9"><div class="wrap">${HD()}<div class="bento"><div class="v">${V()}</div><div class="q">${SAY}${REST}</div>${P.slice(0,2).map((p,i)=>`<div class="c"><span class="n">0${i+1}</span><p class="pt">${p[0]}</p><p class="pd">${p[1]}</p></div>`).join('')}<div class="ph">${D()}</div>${P.slice(2).map((p,i)=>`<div class="c"><span class="n">0${i+3}</span><p class="pt">${p[0]}</p><p class="pd">${p[1]}</p></div>`).join('')}</div></div></section>`],
 ['Mínimo','só a fala no centro, os pilares numa linha corrida separados pela estrela, e três imagens do mesmo tamanho embaixo: vídeo, aula e turma.',
 `<section class="sec a10"><div class="wrap">${HD()}${SAY}${REST}<p class="line">${P.map((p,i)=>`${i?STAR:''}<span>${p[0]}</span>`).join('')}</p><div class="strip"><figure>${V()}</figure><figure>${D()}<figcaption class="cap">Demonstração ao vivo</figcaption></figure><figure>${T('turma-5.webp')}<figcaption class="cap">Turma no studio</figcaption></figure></div></div></section>`],
];
const pad=i=>String(i+1).padStart(2,'0');
document.getElementById('idx').innerHTML=O.map((o,i)=>`<a href="#o${i+1}">${pad(i)}</a>`).join('');
document.getElementById('opts').innerHTML=O.map((o,i)=>`<div class="opt" id="o${i+1}"><div class="meta"><b>${pad(i)}</b><strong>${o[0]}</strong><span>${o[1]}</span></div>${o[2]}</div>`).join('');
/* 04 · o pilar no meio da tela acende */
const rows=[...document.querySelectorAll('.a4 .rows li')];
const ro=new IntersectionObserver(es=>es.forEach(e=>e.target.classList.toggle('on',e.isIntersecting)),{rootMargin:'-40% 0px -40% 0px'});
rows.forEach(r=>ro.observe(r));
/* vídeos: baixam perto, tocam ao aparecer, pausam ao sair; o arquivo fica branco depois de 9,1 s */
const vids=[...document.querySelectorAll('video[data-src]')];
const near=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const v=e.target;if(!v.src){v.src=v.dataset.src;v.preload='auto'}near.unobserve(v)}}),{rootMargin:'400px 0px'});
const vis=new IntersectionObserver(es=>es.forEach(e=>{e.isIntersecting?e.target.play().catch(()=>{}):e.target.pause()}),{threshold:.25});
vids.forEach(v=>{near.observe(v);vis.observe(v);v.addEventListener('timeupdate',()=>{if(v.currentTime>=9.1)v.currentTime=0})});
</script>
