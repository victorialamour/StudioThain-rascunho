<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faixa da frase · 10 direções · Studio Thainá</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&family=Pinyon+Script&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add('js')</script>
<style>
/* ==========================================================================
   FAIXA DA FRASE · 10 direções (rodada feita com a skill impeccable)
   Regras seguidas: sem rótulo acima do título, sem cartões genéricos, sem
   texto em degradê, sem textura falsa; tipografia como protagonista, um
   único momento de movimento por composição, superfícies do navegador
   (seleção, foco, cursor) tingidas com a paleta.
   Paleta da marca: rosa queimado #9A5457, rosa claro #E8C6C6, creme #EDDAC9,
   grafite #161616. Fraunces no destaque, Plus Jakarta Sans no texto,
   Pinyon Script só na assinatura.
   ========================================================================== */
:root{
  --ink:#161616;--body:#4A4544;--muted:#6B6360;--line:#EAE3DE;
  --rose:#9A5457;--rose-d:#7E4044;--rose-dd:#5E2E33;--rose-l:#E8C6C6;--rose-ll:#F6EDEA;--cream:#EDDAC9;--cream-l:#F8F1EB;
  --on-rose:#FBF1EC;--on-rose-2:#F6E3DF;
  --pad:clamp(20px,5vw,72px);--f:"Fraunces",Georgia,serif;--s:"Plus Jakarta Sans",system-ui,sans-serif;
  --out:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--body);font:15px/1.7 var(--s);-webkit-font-smoothing:antialiased;overflow-x:hidden;caret-color:var(--rose)}
::selection{background:var(--rose);color:var(--on-rose)}
:focus-visible{outline:2px solid var(--rose);outline-offset:3px;border-radius:2px}
h1,h2,p,figure,blockquote{margin:0}

/* ---- moldura da página de comparação ---- */
.top{padding:clamp(32px,5vw,56px) var(--pad) 24px;max-width:1180px}
.top h1{font:300 clamp(1.8rem,3.4vw,2.6rem)/1.08 var(--f);letter-spacing:-.025em;color:var(--ink)}
.top p{margin-top:.6rem;max-width:62ch;font-size:.9rem;color:var(--muted)}
.idx{position:sticky;top:0;z-index:10;display:flex;gap:.2rem;padding:.6rem var(--pad);background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.idx a{flex:none;padding:.35rem .6rem;font:500 .74rem var(--s);font-variant-numeric:tabular-nums;color:var(--muted);text-decoration:none;border-radius:4px;transition:color .3s,background .3s}
.idx a:hover{color:var(--ink);background:var(--rose-ll)}
.opt{scroll-margin-top:52px}
.meta{display:flex;flex-wrap:wrap;gap:.2rem 1rem;align-items:baseline;padding:28px var(--pad) 14px;max-width:1180px}
.meta b{font:300 1.3rem/1 var(--f);font-variant-numeric:tabular-nums;color:var(--rose)}
.meta strong{font-weight:600;font-size:.88rem;color:var(--ink)}
.meta span{font-size:.82rem;color:var(--muted)}
.ctx{height:56px;background:#fff;border-top:1px solid var(--line)}

/* ---- tipografia comum ---- */
.q{font:300 clamp(1.9rem,3.6vw,3rem)/1.06 var(--f);font-variation-settings:"opsz" 144;letter-spacing:-.028em;text-wrap:balance}
.q em{font-style:italic}
.p{font:300 italic clamp(1.02rem,1.4vw,1.15rem)/1.4 var(--f);letter-spacing:-.01em}
.t{max-width:46ch;font-size:.9rem;line-height:1.72;text-wrap:pretty}
.sig{font:400 clamp(1.6rem,2.4vw,2rem)/1 "Pinyon Script",cursive}
.band{position:relative;overflow:hidden}

/* ===== 01 · Tensão tipográfica ===== */
.d1{background:var(--rose);color:var(--on-rose);padding:clamp(64px,8vw,104px) var(--pad)}
.d1 .g{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,.85fr);gap:clamp(32px,6vw,96px);max-width:1180px;margin:0 auto;align-items:end}
.d1 .q{font-size:clamp(2.1rem,4.2vw,3.5rem)}
.d1 .q em{color:var(--rose-l)}
.d1 .r{padding-bottom:.4rem}
.d1 .p{color:var(--rose-l)}
.d1 .t{margin-top:.9rem;color:var(--on-rose-2)}
.d1 .sig{margin-top:1.1rem}
.d1 .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.08em}
.d1 .w>span{display:inline-block}
@media (prefers-reduced-motion:no-preference){
  .js .d1 .w>span{transform:translateY(105%);transition:transform 1.1s var(--out);transition-delay:calc(var(--k) * 55ms)}
  .js .d1.is-in .w>span{transform:none}
}

/* ===== 02 · Dois tons, borda seca ===== */
.d2 .g{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.d2 .a{background:var(--rose);color:var(--on-rose);padding:clamp(56px,7vw,96px) clamp(24px,5vw,72px)}
.d2 .a .q em{color:var(--rose-l)}
.d2 .b{background:var(--cream);color:var(--ink);padding:clamp(56px,7vw,96px) clamp(24px,5vw,72px);display:flex;flex-direction:column;justify-content:flex-end}
.d2 .b .p{color:var(--rose-d)}
.d2 .b .t{margin-top:.8rem;color:#4E4440}
.d2 .b .sig{margin-top:1rem;color:var(--ink)}
@media (prefers-reduced-motion:no-preference){
  .js .d2 .b{clip-path:inset(0 0 0 100%);transition:clip-path 1.2s var(--out)}
  .js .d2.is-in .b{clip-path:inset(0 0 0 0)}
}

/* ===== 03 · Retrato em duotone ===== */
.d3{background:var(--rose);color:var(--on-rose)}
.d3 .g{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.65fr);max-width:1280px;margin:0 auto;align-items:stretch}
.d3 .txt{padding:clamp(56px,7vw,96px) clamp(24px,5vw,72px);align-self:center}
.d3 .q em,.d3 .p{color:var(--rose-l)}
.d3 .p{margin-top:.8rem}
.d3 .t{margin-top:.7rem;color:var(--on-rose-2)}
.d3 .sig{margin-top:1rem}
.d3 figure{position:relative;min-height:360px;background:var(--rose-d);isolation:isolate;overflow:hidden}
.d3 figure img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%;filter:grayscale(1) contrast(1.08) brightness(1.06);mix-blend-mode:luminosity;opacity:.92}
.d3 figure::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--rose) 0%,rgba(154,84,87,0) 38%);pointer-events:none}
@media (prefers-reduced-motion:no-preference){
  .js .d3 figure img{transform:scale(1.08);transition:transform 2.2s var(--out)}
  .js .d3.is-in figure img{transform:none}
}

/* ===== 04 · Aspas como arquitetura ===== */
.d4{background:var(--rose-d);color:var(--on-rose);padding:clamp(64px,8vw,104px) var(--pad)}
.d4::before{content:"“";position:absolute;left:clamp(0px,2vw,40px);top:-.06em;font:300 clamp(20rem,38vw,34rem)/.8 var(--f);color:var(--rose);pointer-events:none}
.d4 .in{position:relative;max-width:900px;margin:0 auto 0 clamp(0px,12vw,180px)}
.d4 .q{font-size:clamp(2rem,4vw,3.3rem)}
.d4 .q em{color:var(--rose-l)}
.d4 .row{display:flex;flex-wrap:wrap;gap:1rem 2.4rem;align-items:flex-end;justify-content:space-between;margin-top:1.6rem}
.d4 .p{color:var(--rose-l)}
.d4 .t{margin-top:.5rem;color:var(--on-rose-2)}
@media (prefers-reduced-motion:no-preference){
  .js .d4::before{opacity:0;transform:translateY(30px);transition:opacity 1.4s var(--out),transform 1.6s var(--out)}
  .js .d4.is-in::before{opacity:1;transform:none}
}

/* ===== 05 · Linha que se desenha ===== */
.d5{background:var(--cream-l);color:var(--ink);padding:clamp(64px,8vw,104px) var(--pad);text-align:center}
.d5 .in{max-width:860px;margin:0 auto}
.d5 .q em{color:var(--rose)}
.d5 .rule{display:block;width:min(220px,40%);height:1px;margin:1.6rem auto 1.4rem;background:var(--rose);transform-origin:center}
.d5 .p{color:var(--rose-d)}
.d5 .t{margin:.7rem auto 0;color:var(--body)}
.d5 .sig{margin-top:1rem}
@media (prefers-reduced-motion:no-preference){
  .js .d5 .rule{transform:scaleX(0);transition:transform 1.4s var(--out) .35s}
  .js .d5 .after{opacity:0;transform:translateY(8px);transition:opacity 1s var(--out) 1.2s,transform 1s var(--out) 1.2s}
  .js .d5.is-in .rule{transform:none}
  .js .d5.is-in .after{opacity:1;transform:none}
}

/* ===== 06 · Marca-texto ===== */
.d6{background:var(--rose-ll);color:var(--ink);padding:clamp(64px,8vw,104px) var(--pad)}
.d6 .g{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,.8fr);gap:clamp(32px,6vw,88px);max-width:1120px;margin:0 auto;align-items:end}
.d6 .hl{font-style:italic;color:var(--rose-dd);background:linear-gradient(var(--rose-l),var(--rose-l)) 0 88%/100% .42em no-repeat;padding:0 .08em}
.d6 .p{color:var(--rose-d)}
.d6 .t{margin-top:.7rem}
.d6 .sig{margin-top:1rem}
@media (prefers-reduced-motion:no-preference){
  .js .d6 .hl{background-size:0% .42em;transition:background-size 1.3s var(--out) .4s}
  .js .d6.is-in .hl{background-size:100% .42em}
}

/* ===== 07 · A prova ao lado ===== */
.d7{background:var(--rose);color:var(--on-rose);padding:clamp(56px,7vw,96px) var(--pad)}
.d7 .g{display:grid;grid-template-columns:minmax(0,1.4fr) 240px;gap:clamp(32px,6vw,88px);max-width:1080px;margin:0 auto;align-items:center}
.d7 .q em,.d7 .p{color:var(--rose-l)}
.d7 .p{margin-top:.9rem}
.d7 .t{margin-top:.6rem;color:var(--on-rose-2)}
.d7 .sig{margin-top:1rem}
.d7 figure img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:3px;box-shadow:0 30px 60px -30px rgba(40,10,14,.55)}
.d7 figcaption{display:flex;justify-content:space-between;margin-top:.7rem;font-size:.74rem;letter-spacing:.02em;color:var(--on-rose-2)}
@media (prefers-reduced-motion:no-preference){
  .js .d7 figure img{clip-path:inset(0 0 100% 0);transition:clip-path 1.3s var(--out)}
  .js .d7.is-in figure img{clip-path:inset(0 0 0 0)}
}

/* ===== 08 · Luz lateral ===== */
.d8{background:radial-gradient(120% 140% at 0% 0%,#B26A6D 0%,var(--rose) 42%,var(--rose-d) 100%);color:var(--on-rose);padding:clamp(64px,8vw,104px) var(--pad)}
.d8 .in{max-width:1080px;margin:0 auto}
.d8 .q{max-width:16ch;font-size:clamp(2.1rem,4.2vw,3.5rem)}
.d8 .q em{color:var(--rose-l)}
.d8 .foot{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1rem 3rem;align-items:end;margin-top:2rem;padding-top:1.4rem;border-top:1px solid rgba(251,241,236,.22)}
.d8 .p{color:var(--rose-l)}
.d8 .t{margin-top:.4rem;color:var(--on-rose-2)}
@media (prefers-reduced-motion:no-preference){
  .js .d8 .q{opacity:0;filter:blur(10px);transform:translateY(14px);transition:opacity 1s var(--out),filter 1.1s var(--out),transform 1.1s var(--out)}
  .js .d8.is-in .q{opacity:1;filter:none;transform:none}
}

/* ===== 09 · Grafite e trilho ===== */
.d9{background:var(--ink);color:#F4EEEA;padding:clamp(64px,8vw,104px) var(--pad)}
.d9 .g{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(24px,5vw,72px);max-width:1080px;margin:0 auto}
.d9 .rail{writing-mode:vertical-rl;transform:rotate(180deg);font:300 italic 1rem/1 var(--f);letter-spacing:.02em;color:var(--rose-l);padding:.3rem .9rem 0 0;border-right:1px solid rgba(232,198,198,.3)}
.d9 .q em{color:var(--rose-l)}
.d9 .row{display:flex;flex-wrap:wrap;gap:1rem 3rem;justify-content:space-between;align-items:flex-end;margin-top:1.6rem}
.d9 .p{color:var(--rose-l)}
.d9 .t{margin-top:.5rem;color:rgba(244,238,234,.68)}
@media (prefers-reduced-motion:no-preference){
  .js .d9 .rail{clip-path:inset(0 0 100% 0);transition:clip-path 1.4s var(--out)}
  .js .d9.is-in .rail{clip-path:inset(0)}
}

/* ===== 10 · Fita compacta ===== */
.d10{background:var(--rose);color:var(--on-rose);padding:clamp(36px,4.5vw,56px) var(--pad)}
.d10 .g{display:grid;grid-template-columns:minmax(0,1fr) 1px minmax(0,.55fr) auto;gap:clamp(20px,3.5vw,48px);max-width:1180px;margin:0 auto;align-items:center}
.d10 .q{font-size:clamp(1.5rem,2.6vw,2.15rem)}
.d10 .q em{color:var(--rose-l)}
.d10 .div{align-self:stretch;background:rgba(251,241,236,.3)}
.d10 .p{color:var(--rose-l)}
.d10 .t{font-size:.82rem;margin-top:.3rem;color:var(--on-rose-2)}
@media (prefers-reduced-motion:no-preference){
  .js .d10 .div{transform:scaleY(0);transition:transform 1.2s var(--out) .2s}
  .js .d10.is-in .div{transform:none}
}

/* contraste: texto pequeno sobre o rosa usa um rosa mais claro (>= 4,5:1) */
.d1 .p,.d3 .p,.d7 .p,.d8 .p,.d10 .p{color:#F7E4E0}

/* ===== celular ===== */
@media (max-width:767px){
  .d1 .g,.d2 .g,.d3 .g,.d6 .g,.d7 .g,.d8 .foot{grid-template-columns:minmax(0,1fr)}
  .d3 figure{min-height:0;aspect-ratio:4/3;order:-1}
  .d3 figure::after{background:linear-gradient(0deg,var(--rose) 0%,rgba(154,84,87,0) 45%)}
  .d4::before{font-size:18rem;left:0}
  .d4 .in{margin-left:0}
  .d7 figure{max-width:220px}
  .d9 .g{grid-template-columns:minmax(0,1fr)}
  .d9 .rail{writing-mode:horizontal-tb;transform:none;border-right:0;padding:0 0 .6rem;border-bottom:1px solid rgba(232,198,198,.3)}
  .d10 .g{grid-template-columns:minmax(0,1fr)}
  .d10 .div{display:none}
}
</style>
</head>
<body>
<header class="top">
  <h1>A frase da Thainá, em dez direções</h1>
  <p>Refeitas com a skill impeccable: a tipografia é a protagonista, a cor vem da marca e cada composição tem um único movimento próprio. Role devagar até cada uma para ver a animação. As faixas brancas finas mostram como cada opção encosta nas seções vizinhas.</p>
</header>
<nav class="idx" id="idx" aria-label="Opções"></nav>
<main id="opts"></main>
<script>
const QH='Nem toda sobrancelha precisa de <em>micropigmentação.</em>';
const P='E eu digo isso sendo micropigmentadora.';
const T='Antes de qualquer procedimento, eu olho com calma o seu rosto, a sua expressão e a sua rotina. Às vezes um design bem feito resolve. Você sai sabendo o que faz sentido pra você.';
const SIG='<p class="sig">Thainá</p>';
/* 01: cada palavra numa máscara, para subir em sequência */
const words=()=>{let k=0;return 'Nem toda sobrancelha precisa de'.split(' ').map(w=>`<span class="w"><span style="--k:${k++}">${w}</span></span>`).join(' ')+` <em class="w"><span style="--k:${k++}">micropigmentação.</span></em>`};
const O=[
 ['Tensão tipográfica','A frase grande ocupa dois terços; o complemento fica numa coluna estreita, alinhada pela base. As palavras sobem uma a uma.',
  `<section class="band d1" data-m><div class="g"><h2 class="q">${words()}</h2><div class="r"><p class="p">${P}</p><p class="t">${T}</p>${SIG}</div></div></section>`],
 ['Dois tons, borda seca','Rosa queimado e creme lado a lado, sem moldura. O creme desliza para dentro quando a faixa aparece.',
  `<section class="band d2" data-m><div class="g"><div class="a"><h2 class="q">${QH}</h2></div><div class="b"><p class="p">${P}</p><p class="t">${T}</p>${SIG}</div></div></section>`],
 ['Retrato em duotone','O retrato da Thainá tingido no rosa da marca, fundindo com a faixa. A foto se aproxima devagar ao aparecer.',
  `<section class="band d3" data-m><div class="g"><div class="txt"><h2 class="q">${QH}</h2><p class="p">${P}</p><p class="t">${T}</p>${SIG}</div><figure><img src="../assets/img/thaina-retrato.webp" alt="Retrato da Thainá Cavalcanti" loading="lazy"></figure></div></section>`],
 ['Aspas como arquitetura','Uma aspa gigante, recortada pela borda, vira a estrutura da composição em vinho e rosa.',
  `<section class="band d4" data-m><div class="in"><h2 class="q">${QH}</h2><div class="row"><div><p class="p">${P}</p><p class="t">${T}</p></div>${SIG}</div></div></section>`],
 ['Linha que se desenha','Creme bem claro, tudo centralizado. Um fio rosa se desenha sob a frase e só então o resto aparece.',
  `<section class="band d5" data-m><div class="in"><h2 class="q">${QH}</h2><span class="rule" aria-hidden="true"></span><div class="after"><p class="p">${P}</p><p class="t">${T}</p>${SIG}</div></div></section>`],
 ['Marca-texto','Rosa bem suave; a palavra “micropigmentação” ganha um grifo rosa que se pinta da esquerda para a direita.',
  `<section class="band d6" data-m><div class="g"><h2 class="q">Nem toda sobrancelha precisa de <span class="hl">micropigmentação.</span></h2><div><p class="p">${P}</p><p class="t">${T}</p>${SIG}</div></div></section>`],
 ['A prova ao lado','A frase com um antes e depois feito só com design, sem micropigmentação. O argumento vira evidência.',
  `<section class="band d7" data-m><div class="g"><div><h2 class="q">${QH}</h2><p class="p">${P}</p><p class="t">${T}</p>${SIG}</div><figure><img src="../assets/img/resultados/design-3.webp" alt="Antes e depois de design de sobrancelhas, sem micropigmentação" loading="lazy"><figcaption><span>Antes e depois</span><span>Só design</span></figcaption></figure></div></section>`],
 ['Luz lateral','O rosa recebe uma luz suave vinda do canto, como num estúdio fotográfico. A frase surge do desfoque.',
  `<section class="band d8" data-m><div class="in"><h2 class="q">${QH}</h2><div class="foot"><div><p class="p">${P}</p><p class="t">${T}</p></div>${SIG}</div></div></section>`],
 ['Grafite e trilho','Fundo grafite com um trilho vertical à esquerda, como lombada de livro. Sofisticado, mas repete o tom dos cursos.',
  `<section class="band d9" data-m><div class="g"><p class="rail">Avaliação antes de tudo</p><div><h2 class="q">${QH}</h2><div class="row"><div><p class="p">${P}</p><p class="t">${T}</p></div>${SIG}</div></div></div></section>`],
 ['Fita compacta','Tudo numa faixa baixa: frase, fio vertical, complemento e assinatura na mesma linha. A mais discreta.',
  `<section class="band d10" data-m><div class="g"><h2 class="q">${QH}</h2><span class="div" aria-hidden="true"></span><div><p class="p">${P}</p><p class="t">Às vezes um design bem feito resolve.</p></div>${SIG}</div></section>`],
];
const pad=i=>String(i+1).padStart(2,'0');
document.getElementById('idx').innerHTML=O.map((o,i)=>`<a href="#d${i+1}">${pad(i)}</a>`).join('');
document.getElementById('opts').innerHTML=O.map((o,i)=>`<div class="opt" id="d${i+1}"><div class="meta"><b>${pad(i)}</b><strong>${o[0]}</strong><span>${o[1]}</span></div><div class="ctx"></div>${o[2]}<div class="ctx"></div></div>`).join('');
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('is-in');io.unobserve(e.target)}}),{threshold:.35});
document.querySelectorAll('[data-m]').forEach(el=>io.observe(el));
</script>
</body>
</html>
